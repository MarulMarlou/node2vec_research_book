name: VKR core tests
on:
  push:
    branches:
      - feature/vkr-stage1-typed-graph-holdout
  pull_request:
    paths:
      - "src/vkr_*.py"
      - "tests/test_vkr_*.py"
      - "requirements-vkr-core.txt"
      - ".github/workflows/vkr-tests.yml"
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-vkr-core.txt
      - name: Install core dependencies
        run: python -m pip install -r requirements-vkr-core.txt
      - name: Check app syntax
        run: python -m compileall -q src/vkr_app.py
      - name: Parse Windows PowerShell launcher
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/run_vkr_windows.ps1').Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: Run isolated VKR tests
        run: python -m pytest -q tests/test_vkr_foundation.py tests/test_vkr_recommend_explain.py tests/test_vkr_pipeline.py tests/test_vkr_dashboard.py tests/test_vkr_book_eval.py tests/test_vkr_app_plot.py tests/test_vkr_real_data_regressions.py tests/test_vkr_graph_audit.py tests/test_vkr_embedding_study.py tests/test_vkr_handoff.py tests/test_vkr_transe.py
  streamlit_smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-vkr-app.txt
            requirements-vkr-core.txt
      - name: Install app dependencies
        run: python -m pip install -r requirements-vkr-app.txt
      - name: Exercise Streamlit with synthetic artifacts
        run: python -m pytest -q tests/test_vkr_streamlit_smoke.py
